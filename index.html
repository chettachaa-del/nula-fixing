<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="NuLa Fixing & Services — ขายเทคไม่ทิ้งคน | Selling technology without leaving humanity behind.">
<title>NuLa Fixing & Services</title>
<style>
:root{--bg:#F4F1E8;--surface:#FFFEFA;--ink:#2B2418;--mut:#6B6250;--brand:#3A3524;--brand-ink:#FFFFFF;--soft:#ECE9D8;--line:rgba(58,53,36,.15);--ok:#2F6B3F;--okbg:#E3F0E4;--bad:#A3281F;--pink:#C98A9A}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#14130E;--ink:#EFEBDD;--mut:#A39C86;--brand:#ECE9D8;--brand-ink:#1B1910;--soft:#201E15;--line:rgba(236,233,216,.16);--ok:#8FD19E;--okbg:#14261A;--bad:#F0A39C}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.c{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.acts{display:flex;gap:8px;align-items:center}
.btn{display:inline-block;text-align:center;cursor:pointer;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:10px 20px;border-radius:999px;font:600 .88rem/1.2 inherit}
.btn.o{background:transparent;color:var(--brand)}
.btn.sm{padding:7px 14px;font-size:.8rem}
.ribbon{background:var(--soft);text-align:center;padding:9px 16px;font-size:.8rem}
.ribbon a{font-weight:700;text-decoration:underline;margin-left:6px}
.hero{text-align:center;padding:52px 0 44px}
.hero .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid var(--soft)}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.hero p{color:var(--mut);max-width:520px;margin:0 auto 22px;text-wrap:balance}
.hero .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
section{padding:30px 0}
h2{font-size:1.4rem;letter-spacing:-.01em;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.msg{grid-column:1/-1;padding:22px;border:1px dashed var(--line);border-radius:16px;color:var(--mut);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:var(--soft);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--mut)}
.ph::before{content:attr(data-code)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;background:var(--okbg);color:var(--ok);padding:3px 10px;border-radius:999px}
.card h3{font-size:1.05rem;line-height:1.3}
.d{font-size:.85rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:1.2rem;font-weight:700;margin-top:auto}
.ca{display:flex;gap:8px;flex-wrap:wrap}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.vcard p.s{font-size:.88rem;color:var(--mut);margin-bottom:14px}
.sb{display:flex;gap:8px}
input,select,textarea{width:100%;font:inherit;font-size:.95rem;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sb input{flex:1;min-width:0}
#cert-result{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);font-size:.88rem}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.vals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.vals div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.vals h3{font-size:1.02rem;margin-bottom:4px}
.vals p{font-size:.86rem;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:26px 16px 38px;text-align:center;font-size:.78rem;color:var(--mut)}
footer p+p{margin-top:6px}
.mb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
@media (min-width:640px){.mb{align-items:center;padding:20px}}
.ms{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px 30px}
@media (min-width:640px){.ms{border-radius:24px}}
.x{float:right;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:1rem;cursor:pointer}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:4px}
.box{background:var(--bg);padding:14px;border-radius:14px;font-size:.9rem;margin:14px 0}
.stack{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<header>
  <div class="c nav">
    <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>NuLa</span></div>
    <div class="acts">
      <button class="btn o sm" id="lang" type="button" aria-label="Switch language">EN</button>
      <a class="btn sm" id="tel" data-i="contact" href="#">ติดต่อร้าน</a>
    </div>
  </div>
</header>

<div class="ribbon"><span data-i="ribbon"></span><a href="#verify" data-i="ribbonLink"></a></div>

<main>
<div class="hero c">
  <img class="logo" src="logo.png" alt="NuLa" onerror="this.style.display='none'">
  <h1 data-i="h1"></h1>
  <p data-i="sub"></p>
  <div class="row">
    <a class="btn" href="#stock" data-i="browse"></a>
    <a class="btn o" id="fb" target="_blank" rel="noopener" data-i="fbBtn"></a>
  </div>
</div>

<section id="stock"><div class="c"><h2 data-i="stockH"></h2><div class="grid" id="grid"></div></div></section>

<section id="verify"><div class="c"><div class="vcard">
  <h2 data-i="vTitle"></h2>
  <p class="s" data-i="vSub"></p>
  <div class="sb">
    <input id="cert-input" autocomplete="off" placeholder="NU-007" aria-label="Item ID">
    <button class="btn" id="vbtn" type="button" data-i="vBtn"></button>
  </div>
  <div id="cert-result" role="status" aria-live="polite" hidden></div>
</div></div></section>

<section><div class="c vals">
  <div><h3 data-i="p1t"></h3><p data-i="p1d"></p></div>
  <div><h3 data-i="p2t"></h3><p data-i="p2d"></p></div>
  <div><h3 data-i="p3t"></h3><p data-i="p3d"></p></div>
</div></section>
</main>

<footer>
  <p data-i="foot"></p>
  <p data-i="disc"></p>
  <p><button class="btn o sm" id="admin-btn" type="button" hidden>🔒 Admin</button></p>
</footer>

<!-- รายละเอียดเครื่อง -->
<div class="mb" id="detail"><div class="ms"><button class="x" type="button" aria-label="Close" data-close>✕</button><div id="detail-body"></div></div></div>

<!-- Admin (ต้องใส่ PIN) -->
<div class="mb" id="admin"><div class="ms">
  <button class="x" type="button" aria-label="Close" data-close>✕</button>
  <h3 style="font-size:1.2rem;margin-bottom:12px">NuLa Admin</h3>
  <div class="fg"><label for="adm-pin">Admin PIN</label>
    <div class="sb"><input id="adm-pin" type="password" autocomplete="off"><button class="btn sm" id="unlock" type="button">ปลดล็อก</button></div></div>
  <div id="adm-form" hidden>
    <div class="fg"><label for="adm-id">เครื่อง (Item ID)</label><select id="adm-id"></select></div>
    <div class="fg"><label for="adm-status">สถานะ</label><select id="adm-status"><option value="Available">Available (พร้อมขาย)</option><option value="Sold">Sold (ขายแล้ว)</option></select></div>
    <div class="fg"><label for="adm-price">ราคาขาย (บาท)</label><input id="adm-price" type="number" inputmode="numeric"></div>
    <div class="fg"><label for="adm-desc">คำอธิบาย / สุขภาพแบต / ตำหนิ</label><textarea id="adm-desc" rows="3" maxlength="600"></textarea></div>
    <div class="fg"><label for="adm-file">รูปเครื่อง (.jpg / .png) — แนะนำให้วางไฟล์ NU-xxx.jpg ในโฟลเดอร์เว็บแทน เว็บจะเร็วกว่า</label><input id="adm-file" type="file" accept="image/jpeg,image/png,image/webp"></div>
    <img id="adm-prev" alt="" hidden style="max-height:150px;border-radius:12px;margin-bottom:12px">
    <div class="fg"><label for="adm-fb">ลิงก์โพสต์ Facebook (https://…)</label><input id="adm-fb" type="url"></div>
    <button class="btn" id="adm-save" type="button" style="width:100%">บันทึก</button>
  </div>
  <p id="adm-msg" style="margin-top:10px;text-align:center;font-weight:600;font-size:.88rem" role="status"></p>
</div></div>

<script>
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwSLOstoc8wKeN_EDDAap3jTNRxZAAeG-HpNqDn6iJJ-ibwVzRaPbvV6r4EF9kXCjGb3g/exec",   // วาง Web App URL จาก Apps Script ตรงนี้
  FB_PAGE: "https://www.facebook.com/profile.php?id=61580735953552",
  TEL: "0922808518", TEL_SHOW: "092-280-8518"
};

const T = {
th:{contact:"ติดต่อร้าน",ribbon:"ทุกเครื่องผ่านการตรวจเช็กฮาร์ดแวร์ พร้อมใบรับรองและประกัน 30 วัน",ribbonLink:"เช็กใบรับรอง",
 h1:"ขายเทคไม่ทิ้งคน",sub:"อุปกรณ์มือสองที่ซ่อมและตรวจโดยคนจริง บอกสภาพตรงๆ ในราคาที่เป็นธรรม",browse:"ดูเครื่องพร้อมส่ง",fbBtn:"เพจ Facebook ร้าน",
 stockH:"พร้อมส่ง",more:"ดูเพิ่มเติม",buy:"สั่งซื้อ / ทักแชต",defSub:"ตรวจเช็กฮาร์ดแวร์ครบทุกระบบ พร้อมใบรับรอง NuLa และประกัน 30 วัน",badge:"พร้อมส่ง",
 loading:"กำลังโหลดสต็อก…",err:"โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหรือติดต่อร้าน",empty:"ตอนนี้สินค้าในสต็อกถูกจองหมดแล้ว เตรียมอัปเดตล็อตใหม่เร็วๆ นี้",
 vTitle:"ตรวจสอบใบรับรองเครื่อง",vSub:"กรอกรหัสประจำเครื่อง (เช่น NU-007) เพื่อดูสถานะและการรับประกัน",vBtn:"ตรวจสอบ",
 found:"✓ พบข้อมูลในระบบ NuLa",nf:"✕ ไม่พบรหัสนี้ กรุณาตรวจสอบรหัสบนใบรับรองอีกครั้ง",lId:"รหัสเครื่อง",lModel:"รุ่นและสเปก",lStatus:"สถานะ",lWar:"การรับประกัน",
 p1t:"ขายเทคไม่ทิ้งคน",p1d:"แนะนำตามการใช้งานและงบจริง ไม่ยัดเยียดสเปกเกินจำเป็น",
 p2t:"เปิดเผยประวัติ",p2d:"สุขภาพแบต ประวัติอะไหล่ และรหัสเครื่องอยู่ในใบรับรอง ตรวจย้อนหลังได้",
 p3t:"ลดขยะอิเล็กทรอนิกส์",p3d:"ให้อุปกรณ์ที่ยังดีได้กลับมาใช้งานอีกครั้ง",
 detailH:"รายละเอียดและการตรวจเช็ก",call:"โทรสอบถาม / นัดรับ",post:"ดูโพสต์บน Facebook",
 foot:"© 2026 NuLa Fixing & Services • ขายเทคไม่ทิ้งคน",disc:"NuLa เป็นร้านอิสระ ไม่ได้เกี่ยวข้องกับ Apple, Samsung หรือแบรนด์ที่จำหน่าย"},
en:{contact:"Contact",ribbon:"Every device is hardware-checked, with a certificate and 30-day warranty.",ribbonLink:"Verify certificate",
 h1:"Selling technology without leaving humanity behind",sub:"Pre-owned devices repaired and checked by real people, described honestly at a fair price.",browse:"Browse devices",fbBtn:"Facebook page",
 stockH:"Ready to ship",more:"Details",buy:"Buy / Message",defSub:"Full hardware check passed, NuLa certificate and 30-day warranty included.",badge:"AVAILABLE",
 loading:"Loading stock…",err:"Could not load stock. Please refresh or contact us.",empty:"Everything in stock is reserved right now. New devices are coming soon.",
 vTitle:"Verify a device certificate",vSub:"Enter the device ID (e.g. NU-007) to see its status and warranty.",vBtn:"Verify",
 found:"✓ Found in the NuLa database",nf:"✕ Device ID not found. Please check the code on your certificate.",lId:"Item ID",lModel:"Model & specs",lStatus:"Status",lWar:"Warranty",
 p1t:"Human-first",p1d:"Advice based on your real needs and budget, never unnecessary specs.",
 p2t:"Transparent history",p2d:"Battery health, parts history and model ID are on every certificate.",
 p3t:"Less e-waste",p3d:"Giving good hardware a second life.",
 detailH:"Details and inspection",call:"Call / arrange pickup",post:"View post on Facebook",
 foot:"© 2026 NuLa Fixing & Services • Selling technology without leaving humanity behind",disc:"NuLa is an independent shop, not affiliated with Apple, Samsung or other brands sold."}
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(u || "") ? u : CONFIG.FB_PAGE;
const safeImg = u => /^(data:image\/(jpeg|png|webp);base64,|https:\/\/)/i.test(u || "") ? u : "";
const imgOf = i => safeImg(i.image) || encodeURIComponent(i.id) + ".jpg";
const money = n => "฿" + Number(n || 0).toLocaleString("en-US");

let lang = (navigator.language || "th").slice(0,2) === "en" ? "en" : "th";
try{ lang = localStorage.getItem("nula-lang") || lang; }catch(e){}
let stock = [], all = [], state = "loading";

function applyText(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i] ?? "");
  $("lang").textContent = lang === "th" ? "EN" : "ไทย";
  $("fb").href = CONFIG.FB_PAGE;
  $("tel").href = "tel:" + CONFIG.TEL;
  render();
}

function render(){
  const t = T[lang], g = $("grid");
  if(state !== "ok"){ g.innerHTML = `<p class="msg">${esc(t[state === "err" ? "err" : "loading"])}</p>`; return; }
  g.innerHTML = stock.length ? stock.map(i => `
    <article class="card">
      <div class="ph" data-code="${esc(i.id)}" data-id="${esc(i.id)}"><img loading="lazy" decoding="async" src="${esc(imgOf(i))}" alt="${esc(i.model)}" onerror="this.remove()"></div>
      <div class="cb">
        <span class="tag">${esc(t.badge)} · ${esc(i.id)}</span>
        <h3>${esc(i.model)}</h3>
        <p class="d">${esc(i.desc || t.defSub)}</p>
        <p class="pr">${money(i.price)}</p>
        <div class="ca">
          <button class="btn sm" type="button" data-id="${esc(i.id)}">${esc(t.more)}</button>
          <a class="btn sm o" href="${esc(safeUrl(i.fbLink))}" target="_blank" rel="noopener">${esc(t.buy)}</a>
        </div>
      </div>
    </article>`).join("") : `<p class="msg">${esc(t.empty)}</p>`;
}

function openDetail(id){
  const i = stock.find(d => d.id === id); if(!i) return;
  const t = T[lang];
  $("detail-body").innerHTML = `
    <span class="tag">${esc(t.badge)} · ${esc(i.id)}</span>
    <h3 style="font-size:1.4rem;margin:8px 0 2px">${esc(i.model)}</h3>
    <p style="font-size:1.25rem;font-weight:700;margin-bottom:12px">${money(i.price)}</p>
    <img src="${esc(imgOf(i))}" alt="" onerror="this.remove()" style="width:100%;max-height:300px;object-fit:cover;border-radius:16px">
    <div class="box"><p style="font-weight:700;margin-bottom:6px">${esc(t.detailH)}</p>
      <p style="color:var(--mut);white-space:pre-line">${esc(i.desc || t.defSub)}</p>
      <p class="ok" style="margin-top:10px">✓ ${esc(i.warranty || "30 Days NuLa Shop Warranty")}</p></div>
    <p id="cert-slot" style="margin-bottom:10px"></p>
    <div class="stack">
      <a class="btn" href="tel:${CONFIG.TEL}">📞 ${esc(t.call)} (${CONFIG.TEL_SHOW})</a>
      <a class="btn o" href="${esc(safeUrl(i.fbLink))}" target="_blank" rel="noopener">💬 ${esc(t.post)}</a>
    </div>`;
  $("detail").style.display = "flex";
  certLink(i.id).then(u => { if(u) $("cert-slot").innerHTML = `<a class="ok" href="${esc(u)}" target="_blank" rel="noopener">📄 ${esc(CERT_TXT[lang])}</a>`; });
}

async function load(){
  state = "loading"; render();
  try{
    const r = await fetch(CONFIG.API_URL);
    if(!r.ok) throw 0;
    const d = await r.json();
    if(d.error) throw 0;
    stock = d.inStock || []; all = d.allDevices || []; state = "ok";
  }catch(e){ state = "err"; }
  render();
}

const CERT_TXT = {th:"ดูใบรับรองฉบับเต็ม (PDF)", en:"View full certificate (PDF)"};
async function certLink(id){
  const u = "certs/" + encodeURIComponent(id) + ".pdf";
  try{
    if(location.protocol === "file:") return u;
    const r = await fetch(u, {method:"HEAD"});
    return r.ok ? u : "";
  }catch(e){ return ""; }
}

async function verify(){
  const t = T[lang], code = $("cert-input").value.trim().toUpperCase(), box = $("cert-result");
  if(!code){ box.hidden = true; return; }
  const f = all.find(d => String(d.id).toUpperCase() === code);
  const cl = f ? await certLink(f.id) : "";
  box.hidden = false;
  box.innerHTML = f
    ? `<p class="ok">${esc(t.found)}</p><p>${esc(t.lId)}: ${esc(f.id)}<br>${esc(t.lModel)}: ${esc(f.model)}<br>${esc(t.lStatus)}: ${esc(f.status)}<br>${esc(t.lWar)}: ${esc(f.warranty)}</p>${cl ? `<p style="margin-top:8px"><a class="ok" href="${esc(cl)}" target="_blank" rel="noopener">📄 ${esc(CERT_TXT[lang])}</a></p>` : ""}`
    : `<p class="bad">${esc(t.nf)}</p>`;
}

/* ===== Admin: ต้องใส่ PIN, ข้อมูลเต็มดึงผ่าน POST เท่านั้น ===== */
let adm = [], pin = "", img64 = "";
const msg = (s, bad) => { const m = $("adm-msg"); m.textContent = s; m.className = bad ? "bad" : "ok"; };
const post = async body => (await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})).json();

function openAdmin(){ $("adm-form").hidden = true; $("adm-pin").value = ""; msg(""); $("admin").style.display = "flex"; }
function closeAll(){ document.querySelectorAll(".mb").forEach(m => m.style.display = "none"); pin = ""; adm = []; img64 = ""; }

async function unlock(){
  pin = $("adm-pin").value.trim();
  if(!pin) return;
  msg("กำลังตรวจสอบ…");
  try{
    const r = await post({pin, action:"list"});
    if(!r.ok) return msg(r.error || "PIN ไม่ถูกต้อง", true);
    adm = r.devices || [];
    $("adm-id").innerHTML = adm.map(d => `<option value="${esc(d.id)}">${esc(d.id)} — ${esc(d.model)}</option>`).join("");
    fill(); $("adm-form").hidden = false; msg("");
  }catch(e){ msg("เชื่อมต่อไม่ได้ ตรวจว่า Deploy New Version แล้ว", true); }
}

function fill(){
  const d = adm.find(x => x.id === $("adm-id").value); if(!d) return;
  $("adm-status").value = /^(available|in stock)$/i.test(d.status) ? "Available" : "Sold";
  $("adm-price").value = d.price || ""; $("adm-desc").value = d.desc || ""; $("adm-fb").value = d.fbLink || "";
  img64 = ""; $("adm-prev").hidden = true; $("adm-file").value = "";
}

function onFile(e){
  const f = e.target.files[0]; if(!f) return;
  if(/heic|heif/i.test(f.type + f.name)) return msg("ไฟล์ HEIC ใช้ไม่ได้ กรุณาแปลงเป็น JPEG ก่อน (Mac: คลิกขวา > Quick Actions > Convert Image)", true);
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 380 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      let q = .65, out = c.toDataURL("image/jpeg", q);
      while(out.length > 48000 && q > .3){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      if(out.length > 48000) return msg("รูปใหญ่เกินไป ลองรูปอื่น หรือวางไฟล์ในโฟลเดอร์เว็บแทน", true);
      img64 = out; $("adm-prev").src = out; $("adm-prev").hidden = false; msg("เตรียมรูปแล้ว กดบันทึกได้เลย");
    };
    im.onerror = () => msg("อ่านไฟล์รูปนี้ไม่ได้", true);
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

async function save(){
  const b = $("adm-save"); b.disabled = true; msg("กำลังบันทึก…");
  try{
    const r = await post({pin, id:$("adm-id").value, status:$("adm-status").value, price:$("adm-price").value,
      desc:$("adm-desc").value.trim(), fbLink:$("adm-fb").value.trim(), image:img64});
    if(r.ok){ msg("✓ บันทึกลง Google Sheets แล้ว"); img64 = ""; load(); }
    else msg(r.error || "บันทึกไม่สำเร็จ", true);
  }catch(e){ msg("บันทึกไม่สำเร็จ (เชื่อมต่อไม่ได้) กรุณาลองใหม่", true); }
  b.disabled = false;
}

/* ===== events ===== */
$("grid").addEventListener("click", e => { const t = e.target.closest("[data-id]"); if(t) openDetail(t.dataset.id); });
document.querySelectorAll(".mb").forEach(m => m.addEventListener("click", e => { if(e.target === m || e.target.hasAttribute("data-close")) closeAll(); }));
document.addEventListener("keydown", e => { if(e.key === "Escape") closeAll(); });
$("vbtn").addEventListener("click", verify);
$("cert-input").addEventListener("keydown", e => { if(e.key === "Enter") verify(); });
$("lang").addEventListener("click", () => { lang = lang === "th" ? "en" : "th"; try{ localStorage.setItem("nula-lang", lang); }catch(e){} applyText(); verify(); });
$("admin-btn").addEventListener("click", openAdmin);
$("unlock").addEventListener("click", unlock);
$("adm-pin").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
$("adm-id").addEventListener("change", fill);
$("adm-file").addEventListener("change", onFile);
$("adm-save").addEventListener("click", save);
if(location.hash === "#admin") $("admin-btn").hidden = false;
addEventListener("hashchange", () => { $("admin-btn").hidden = location.hash !== "#admin"; });

applyText();
load();
</script>
