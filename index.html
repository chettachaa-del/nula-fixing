<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="NuLa Fixing & Services — ขายเทคไม่ทิ้งคน | Selling technology without leaving humanity behind.">
<title>NuLa Fixing & Services</title>
<style>
:root{--bg:#F4F1E8;--surface:#FFFEFA;--ink:#2B2418;--mut:#6B6250;--brand:#3A3524;--brand-ink:#FFFFFF;--soft:#ECE9D8;--line:rgba(58,53,36,.15);--ok:#2F6B3F;--okbg:#E3F0E4;--bad:#A3281F;--pink:#C98A9A;--star:#D9822B}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#14130E;--ink:#EFEBDD;--mut:#A39C86;--brand:#ECE9D8;--brand-ink:#1B1910;--soft:#201E15;--line:rgba(236,233,216,.16);--ok:#8FD19E;--okbg:#14261A;--bad:#F0A39C;--star:#F5B041}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.c{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.acts{display:flex;gap:8px;align-items:center}
.btn{display:inline-block;text-align:center;cursor:pointer;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:10px 20px;border-radius:999px;font:600 .88rem/1.2 inherit}
.btn.o{background:transparent;color:var(--brand)}
.btn.sm{padding:7px 14px;font-size:.8rem}
.ribbon{background:var(--soft);text-align:center;padding:9px 16px;font-size:.8rem}
.ribbon a{font-weight:700;text-decoration:underline;margin-left:6px}
.hero{text-align:center;padding:52px 0 44px}
.hero .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid var(--soft)}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.hero p{color:var(--mut);max-width:520px;margin:0 auto 22px;text-wrap:balance}
.hero .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
section{padding:30px 0}
h2{font-size:1.4rem;letter-spacing:-.01em;margin-bottom:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{margin-bottom:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.msg{grid-column:1/-1;padding:22px;border:1px dashed var(--line);border-radius:16px;color:var(--mut);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:var(--soft);cursor:pointer;display:grid;place-items:center;font-weight:700;color:var(--mut)}
.ph::before{content:attr(data-code)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;background:var(--okbg);color:var(--ok);padding:3px 10px;border-radius:999px}
.card h3{font-size:1.05rem;line-height:1.3}
.d{font-size:.85rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:1.2rem;font-weight:700;margin-top:auto}
.ca{display:flex;gap:8px;flex-wrap:wrap}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.vcard p.s{font-size:.88rem;color:var(--mut);margin-bottom:14px}
.sb{display:flex;gap:8px}
input,select,textarea{width:100%;font:inherit;font-size:.95rem;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sb input{flex:1;min-width:0}
#cert-result{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);font-size:.88rem}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.vals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.vals div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.vals h3{font-size:1.02rem;margin-bottom:4px}
.vals p{font-size:.86rem;color:var(--mut)}

/* ===== Customer Reviews ===== */
.rgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;animation:up .4s ease-out backwards}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{color:var(--star);font-size:.95rem;letter-spacing:1.5px}
.rtxt{font-size:.9rem;line-height:1.55;color:var(--ink)}
.rphotos{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rphotos img{width:68px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:transform .15s}
.rphotos img:hover{transform:scale(1.05)}
.rfoot{border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mut)}
.rcode{background:var(--soft);padding:3px 9px;border-radius:8px;font-weight:600;color:var(--ink);white-space:nowrap;border:0;cursor:pointer;font-family:inherit;font-size:.75rem}
.rcode:hover{opacity:.8}

footer{border-top:1px solid var(--line);padding:26px 16px 38px;text-align:center;font-size:.78rem;color:var(--mut)}
footer p+p{margin-top:6px}
.mb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
@media (min-width:640px){.mb{align-items:center;padding:20px}}
.ms{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px 30px}
@media (min-width:640px){.ms{border-radius:24px}}
.x{float:right;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:1rem;cursor:pointer}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:4px}
.box{background:var(--bg);padding:14px;border-radius:14px;font-size:.9rem;margin:14px 0}
.stack{display:flex;flex-direction:column;gap:10px}

@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero>*{animation:up .5s ease-out backwards}
.hero>:nth-child(2){animation-delay:.06s}.hero>:nth-child(3){animation-delay:.12s}.hero>:nth-child(4){animation-delay:.18s}
.card{animation:up .4s ease-out backwards;transition:transform .2s,box-shadow .2s}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(n+5){animation-delay:.2s}
.grid.static .card{animation:none}
.ph img{opacity:0;transition:opacity .3s,transform .4s}
.ph img.in{opacity:1}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}.card:hover .ph img{transform:scale(1.03)}}
.btn{transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.mb{animation:fade .2s ease-out}
.ms{animation:rise .25s ease-out}
#cert-result:not([hidden]){animation:fade .25s ease-out}
.gal{position:relative;margin-bottom:12px;border-radius:16px;overflow:hidden;background:var(--soft)}
.gs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gs::-webkit-scrollbar{display:none}
.gs img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:contain;scroll-snap-align:center;opacity:0;transition:opacity .3s}
.gs img.in{opacity:1}
.dots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(40,38,28,.6)}
.dots button{position:relative;width:6px;height:6px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.55);cursor:pointer;transition:width .35s cubic-bezier(.4,0,.2,1),background .25s}
.dots button::after{content:"";position:absolute;inset:-8px -3px}
.dots button.on{width:22px;background:#fff}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(40,38,28,.6);color:#fff;font-size:1.2rem;line-height:1;cursor:pointer;display:none}
.nv.p{left:8px}.nv.n{right:8px}
@media (hover:hover){.nv{display:block}}
.cnt{position:absolute;right:8px;top:8px;z-index:1;background:rgba(40,38,28,.65);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
</style>
</head>
<body>

<header>
  <div class="c nav">
    <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>NuLa</span></div>
    <div class="acts">
      <button class="btn o sm" id="lang" type="button" aria-label="Switch language">EN</button>
      <a class="btn sm" id="tel" data-i="contact" href="#">ติดต่อร้าน</a>
    </div>
  </div>
</header>

<div class="ribbon"><span data-i="ribbon"></span><a href="#verify" data-i="ribbonLink"></a></div>

<main>
<div class="hero c">
  <img class="logo" src="logo.png" alt="NuLa" onerror="this.style.display='none'">
  <h1 data-i="h1"></h1>
  <p data-i="sub"></p>
  <div class="row">
    <a class="btn" href="#stock" data-i="browse"></a>
    <a class="btn o" id="fb" target="_blank" rel="noopener" data-i="fbBtn"></a>
  </div>
</div>

<section id="stock"><div class="c"><h2 data-i="stockH"></h2><div class="grid" id="grid"></div></div></section>

<!-- รีวิวจากลูกค้าจริง + ปุ่มเขียนรีวิว -->
<section id="reviews-sec"><div class="c">
  <div class="sechead">
    <h2 data-i="revH"></h2>
    <button class="btn o sm" id="open-rev" type="button" data-i="revWriteBtn"></button>
  </div>
  <div class="rgrid" id="rgrid"></div>
</div></section>

<section id="verify"><div class="c"><div class="vcard">
  <h2 data-i="vTitle"></h2>
  <p class="s" data-i="vSub"></p>
  <div class="sb">
    <input id="cert-input" autocomplete="off" placeholder="NU-007" aria-label="Item ID">
    <button class="btn" id="vbtn" type="button" data-i="vBtn"></button>
  </div>
  <div id="cert-result" role="status" aria-live="polite" hidden></div>
</div></div></section>

<section><div class="c vals">
  <div><h3 data-i="p1t"></h3><p data-i="p1d"></p></div>
  <div><h3 data-i="p2t"></h3><p data-i="p2d"></p></div>
  <div><h3 data-i="p3t"></h3><p data-i="p3d"></p></div>
</div></section>
</main>

<footer>
  <p data-i="foot"></p>
  <p data-i="disc"></p>
  <p><button class="btn o sm" id="admin-btn" type="button" hidden>🔒 Admin</button></p>
</footer>

<!-- รายละเอียดเครื่อง -->
<div class="mb" id="detail"><div class="ms"><button class="x" type="button" aria-label="Close" data-close>✕</button><div id="detail-body"></div></div></div>

<!-- ฟอร์มเขียนรีวิวของลูกค้า (รองรับแนบรูปจริงสูงสุด 2 รูป) -->
<div class="mb" id="rev-modal"><div class="ms">
  <button class="x" type="button" aria-label="Close" data-close>✕</button>
  <h3 style="font-size:1.2rem;margin-bottom:4px" data-i="revModalT"></h3>
  <p style="font-size:.84rem;color:var(--mut);margin-bottom:14px" data-i="revModalS"></p>
  <form id="rev-form">
    <div class="fg"><label for="rf-code" data-i="revCodeL"></label><input id="rf-code" required maxlength="20" placeholder="NU-007" style="text-transform:uppercase"></div>
    <div class="fg"><label for="rf-name" data-i="revNameL"></label><input id="rf-name" required maxlength="60"></div>
    <div class="fg"><label for="rf-prov" data-i="revProvL"></label><input id="rf-prov" maxlength="40" placeholder="บุรีรัมย์ / ภูเก็ต"></div>
    <div class="fg"><label for="rf-rate" data-i="revRateL"></label>
      <select id="rf-rate">
        <option value="5">★★★★★ (5/5)</option>
        <option value="4">★★★★☆ (4/5)</option>
        <option value="3">★★★☆☆ (3/5)</option>
      </select>
    </div>
    <div class="fg"><label for="rf-text" data-i="revTextL"></label><textarea id="rf-text" rows="3" required maxlength="400"></textarea></div>
    <div class="fg">
      <label for="rf-photos" data-i="revPhotoL"></label>
      <input id="rf-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <div id="rf-prev" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"></div>
    </div>
    <button class="btn" type="submit" id="rf-sub" style="width:100%" data-i="revSubBtn"></button>
    <p id="rf-msg" style="margin-top:10px;text-align:center;font-weight:600;font-size:.86rem" role="status"></p>
  </form>
</div></div>

<!-- Admin (ต้องใส่ PIN) -->
<div class="mb" id="admin"><div class="ms">
  <button class="x" type="button" aria-label="Close" data-close>✕</button>
  <h3 style="font-size:1.2rem;margin-bottom:12px">NuLa Admin</h3>
  <div class="fg"><label for="adm-pin">Admin PIN</label>
    <div class="sb"><input id="adm-pin" type="password" autocomplete="off"><button class="btn sm" id="unlock" type="button">ปลดล็อก</button></div></div>
  <div id="adm-form" hidden>
    <div class="fg"><label for="adm-id">เครื่อง (Item ID)</label><select id="adm-id"></select></div>
    <div class="fg"><label for="adm-status">สถานะ</label><select id="adm-status"><option value="Available">Available (พร้อมขาย)</option><option value="Sold">Sold (ขายแล้ว)</option></select></div>
    <div class="fg"><label for="adm-price">ราคาขาย (บาท)</label><input id="adm-price" type="number" inputmode="numeric"></div>
    <div class="fg"><label for="adm-desc">คำอธิบาย / สุขภาพแบต / ตำหนิ</label><textarea id="adm-desc" rows="3" maxlength="600"></textarea></div>
    <div class="fg"><label for="adm-img">รูปเครื่อง: ลิงก์หรือชื่อไฟล์ บรรทัดละ 1 รูป (สูงสุด 10) รูปแรกคือรูปปก · คลิกรูปตัวอย่างเพื่อลบ</label><textarea id="adm-img" rows="4" placeholder="NU-007-1.webp&#10;NU-007-2.webp"></textarea></div>
    <div id="adm-thumbs" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px"></div>
    <div class="fg"><label for="adm-up">เพิ่มรูปจากเครื่อง (เลือกได้หลายรูป ระบบย่อให้อัตโนมัติ)</label><input id="adm-up" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
    <div class="fg"><label for="adm-fb">ลิงก์โพสต์ Facebook (https://…)</label><input id="adm-fb" type="url"></div>
    <button class="btn" id="adm-save" type="button" style="width:100%">บันทึก</button>
  </div>
  <p id="adm-msg" style="margin-top:10px;text-align:center;font-weight:600;font-size:.88rem" role="status"></p>
</div></div>

<script>
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwSLOstoc8wKeN_EDDAap3jTNRxZAAeG-HpNqDn6iJJ-ibwVzRaPbvV6r4EF9kXCjGb3g/exec",
  FB_PAGE: "https://www.facebook.com/profile.php?id=61580735953552",
  TEL: "0922808518", TEL_SHOW: "092-280-8518",
  WARRANTY_DAYS: 7
};

const T = {
th:{contact:"ติดต่อร้าน",ribbon:"ทุกเครื่องผ่านการตรวจเช็กฮาร์ดแวร์ พร้อมใบรับรองและประกัน {d} วัน",ribbonLink:"เช็กใบรับรอง",
 h1:"ขายเทคไม่ทิ้งคน",sub:"อุปกรณ์มือสองที่ซ่อมและตรวจโดยคนจริง บอกสภาพตรงๆ ในราคาที่เป็นธรรม",browse:"ดูเครื่องพร้อมส่ง",fbBtn:"เพจ Facebook ร้าน",
 stockH:"พร้อมส่ง",more:"ดูเพิ่มเติม",buy:"สั่งซื้อ / ทักแชต",defSub:"ตรวจเช็กฮาร์ดแวร์ครบทุกระบบ พร้อมใบรับรอง NuLa และประกัน {d} วัน",badge:"พร้อมส่ง",
 loading:"กำลังโหลดสต็อก…",err:"โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหรือติดต่อร้าน",empty:"ตอนนี้สินค้าในสต็อกถูกจองหมดแล้ว เตรียมอัปเดตล็อตใหม่เร็วๆ นี้",
 revH:"รีวิวจากลูกค้าจริง",revWriteBtn:"✍️ เขียนรีวิวให้ร้าน",revBadge:"✓ ซื้อจริง",revCust:"คุณ",revProv:"จ.",revCheckCert:"🔍 เช็กใบรับรอง",
 revEmpty:"ยังไม่มีรีวิวในหน้านี้ — ซื้อเครื่องไปแล้วกดปุ่ม 'เขียนรีวิวให้ร้าน' ด้านบนได้เลยครับ!",
 revModalT:"เขียนรีวิวความประทับใจ",revModalS:"กรอกรหัสประจำเครื่องบนใบรับรอง NuLa เพื่อยืนยันการซื้อจริง",
 revCodeL:"รหัสเครื่อง (Item ID) *",revNameL:"ชื่อเล่นผู้ซื้อ *",revProvL:"จังหวัด (ไม่บังคับ)",revRateL:"ความพึงพอใจ",revTextL:"ข้อความรีวิว *",
 revPhotoL:"แนบรูปตัวเครื่องจริง / ใบรับรอง (สูงสุด 2 รูป — ไม่บังคับ)",
 revSubBtn:"ส่งรีวิว",revSending:"กำลังส่งรีวิวและอัปโหลดรูป…",revOk:"✓ ขอบคุณสำหรับรีวิวครับ! ข้อความและรูปจะแสดงบนหน้าเว็บหลังร้านตรวจสอบเรียบร้อยแล้ว",revErr:"ส่งรีวิวไม่สำเร็จ กรุณาตรวจสอบรหัสเครื่องอีกครั้ง",

 found:"✓ พบข้อมูลในระบบ NuLa",nf:"✕ ไม่พบรหัสนี้ กรุณาตรวจสอบรหัสบนใบรับรองอีกครั้ง",lId:"รหัสเครื่อง",lModel:"รุ่นและสเปก",lStatus:"สถานะ",lWar:"การรับประกัน",
 p1t:"ขายเทคไม่ทิ้งคน",p1d:"แนะนำตามการใช้งานและงบจริง ไม่ยัดเยียดสเปกเกินจำเป็น",

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(u || "") ? u : CONFIG.FB_PAGE;
const imgUrl = u => { u = String(u || "").trim(); if(/^https:\/\//i.test(u)) return u; return /^[\w\-.]+\.(jpe?g|png|webp|avif)$/i.test(u) ? "img/" + u : ""; };
const imgsOf = i => { const l = (Array.isArray(i.images) ? i.images : []).map(imgUrl).filter(Boolean).slice(0, 10); return l.length ? l : [encodeURIComponent(i.id) + ".jpg"]; };
const imgOf = i => imgsOf(i)[0];
const tx = s => String(s).replace("{d}", CONFIG.WARRANTY_DAYS);
const warr = () => lang === "th" ? `ประกันร้าน NuLa ${CONFIG.WARRANTY_DAYS} วัน` : `${CONFIG.WARRANTY_DAYS}-day NuLa shop warranty`;
const money = n => "฿" + Number(n || 0).toLocaleString("en-US");

function galleryHTML(list, alt){
  const imgs = list.map((u, k) => `<img src="${esc(u)}" alt="${esc(alt)} ${k + 1}"${k ? ' loading="lazy"' : ''} decoding="async" onload="this.classList.add('in')" onerror="this.remove()">`).join("");
  const nav = list.length > 1
    ? `<div class="dots">${list.map((_, k) => `<button type="button" class="${k ? "" : "on"}" aria-label="${k + 1}/${list.length}"></button>`).join("")}</div><button class="nv p" type="button" aria-label="Previous">‹</button><button class="nv n" type="button" aria-label="Next">›</button>`
    : "";
  return `<div class="gal"><div class="gs">${imgs}</div>${nav}</div>`;
}

function initGallery(root){
  const gs = root.querySelector(".gs"), dots = root.querySelectorAll(".dots button");
  if(!gs || !dots.length) return;
  const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let cur = 0, tick = 0;
  const go = k => { k = Math.max(0, Math.min(dots.length - 1, k)); gs.scrollTo({left: k * gs.clientWidth, behavior: calm ? "auto" : "smooth"}); };
  gs.addEventListener("scroll", () => {
    if(tick) return;
    tick = requestAnimationFrame(() => {
      tick = 0;
      const k = Math.min(dots.length - 1, Math.round(gs.scrollLeft / gs.clientWidth));
      if(k !== cur){ dots[cur].classList.remove("on"); dots[k].classList.add("on"); cur = k; }
    });
  }, {passive:true});
  dots.forEach((d, k) => d.addEventListener("click", () => go(k)));
  root.querySelector(".nv.p").addEventListener("click", () => go(cur - 1));
  root.querySelector(".nv.n").addEventListener("click", () => go(cur + 1));
  gs.tabIndex = 0;
  gs.addEventListener("keydown", e => { if(e.key === "ArrowRight") go(cur + 1); if(e.key === "ArrowLeft") go(cur - 1); });
}

async function load(){
  state = "loading"; render();
  try{
    const r = await fetch(CONFIG.API_URL);
    if(!r.ok) throw 0;
    const d = await r.json();
    if(d.error) throw 0;
    stock = d.inStock || []; all = d.allDevices || []; reviews = d.reviews || []; state = "ok";
  }catch(e){ state = "err"; }
  render();
  renderReviews();
}

const CERT_TXT = {th:"ดูใบรับรองฉบับเต็ม (PDF)", en:"View full certificate (PDF)"};
async function certLink(id){
  const u = "certs/" + encodeURIComponent(id) + ".pdf";
  try{
    if(location.protocol === "file:") return u;
    const r = await fetch(u, {method:"HEAD"});
    return r.ok ? u : "";
  }catch(e){ return ""; }
}

async function verify(){
  const t = T[lang], code = $("cert-input").value.trim().toUpperCase(), box = $("cert-result");
  if(!code){ box.hidden = true; return; }
  const f = all.find(d => String(d.id).toUpperCase() === code);
  const cl = f ? await certLink(f.id) : "";
  box.hidden = false;
  box.innerHTML = f
    ? `<p class="ok">${esc(t.found)}</p><p>${esc(t.lId)}: ${esc(f.id)}<br>${esc(t.lModel)}: ${esc(f.model)}<br>${esc(t.lStatus)}: ${esc(f.status)}<br>${esc(t.lWar)}: ${esc(warr())}</p>${cl ? `<p style="margin-top:8px"><a class="ok" href="${esc(cl)}" target="_blank" rel="noopener">📄 ${esc(CERT_TXT[lang])}</a></p>` : ""}`
    : `<p class="bad">${esc(t.nf)}</p>`;
}

}

function shrink(file, maxSide = 1200, qual = .82){
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      URL.revokeObjectURL(u);
      const s = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", qual));
    };
    im.onerror = () => rej(new Error("อ่านไฟล์นี้ไม่ได้ (ไฟล์ HEIC ให้แปลงเป็น JPEG ก่อน)"));
    im.src = u;
  });
}

async function onUpload(e){
  const files = [...e.target.files].slice(0, 10); if(!files.length) return;
  const ta = $("adm-img"), id = $("adm-id").value;
  for(let k = 0; k < files.length; k++){
    msg(`กำลังอัปโหลดรูป ${k + 1}/${files.length}…`);
    try{
      const r = await post({pin, action:"upload", id, data: await shrink(files[k])});
      if(!r.ok) throw new Error(r.error || "ตรวจว่า Deploy New Version แล้ว");
      ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + r.url; thumbs();
    }catch(err){ msg(`รูปที่ ${k + 1} ไม่สำเร็จ: ` + err.message, true); e.target.value = ""; return; }
  }
  e.target.value = ""; msg("✓ อัปโหลดแล้ว กด “บันทึก” เพื่อนำรูปขึ้นเว็บ");
}

      action: "review",
      itemCode: $("rf-code").value.trim().toUpperCase(),
      customer: $("rf-name").value.trim(),
      province: $("rf-prov").value.trim(),
      rating: $("rf-rate").value,
      comment: $("rf-text").value.trim(),
      photos: revPhotoData
    });
    if(r.ok) {
      m.className = "ok"; m.textContent = t.revOk;
      e.target.reset();
      $("rf-prev").innerHTML = "";
      revPhotoData = [];
    } else {
      m.className = "bad"; m.textContent = r.error || t.revErr;
    }
  } catch(err) {
    m.className = "bad"; m.textContent = t.revErr;
  }
  btn.disabled = false;
});

applyText();
load();
</script>
</body>
</html>
